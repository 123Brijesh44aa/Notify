

services:
  mysql:
    image: mysql:8.0
    container_name: notify-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: notify_db
    ports:
      - "3312:3306"
    volumes:
      - notify_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  notify_mysql_data: