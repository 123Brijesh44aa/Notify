spring:
  application:
    name: Notify


  # Mysql database
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3312}/${DB_NAME:notify_db}?allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000  # 24 hours

app:
  encryption-key: ${APP_ENCRYPTION_KEY}
  frontend-url: ${APP_FRONTEND_URL}
  public-url: ${APP_PUBLIC_URL}

github:
  oauth:
    client-id: ${GITHUB_OAUTH_CLIENT_ID}
    client-secret: ${GITHUB_OAUTH_CLIENT_SECRET}
    redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI}
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET}

server:
  port: 8088
